services:
  - type: web
    name: fit-lead-training-api
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python3 -B server.py
    healthCheckPath: /api/health
    envVars:
      - key: FIT_HOST
        value: 0.0.0.0
      - key: FIT_PRODUCTION
        value: '1'
      - key: FIT_HR_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: FIT_ALLOWED_ORIGINS
        value: https://skimirilov.github.io
